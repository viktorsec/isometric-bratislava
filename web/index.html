<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bratislava — isometric mosaic</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="view"></canvas>

<div id="controls">
  <button id="zoom-in" title="Zoom in (+)" aria-label="Zoom in">+</button>
  <button id="zoom-out" title="Zoom out (−)" aria-label="Zoom out">−</button>
  <button id="zoom-fit" title="Fit to screen (0)" aria-label="Fit to screen">⤢</button>
</div>

<!-- One button per rendering, filled in from info.js. -->
<div id="layers" role="group" aria-label="Rendering"></div>

<div id="tools">
  <button id="grid-toggle" type="button" aria-pressed="false"
          title="Show the export/import grid (G)">Grid</button>
  <button id="redrawn-toggle" type="button" aria-pressed="false" hidden
          title="Show the cells dropped back in re-rendered (R)">Redrawn</button>
  <button id="prompt-toggle" type="button" aria-pressed="false"
          aria-controls="sidebar"
          title="Open the prompt builder (P)">Prompt</button>
</div>

<!-- Right-hand sidebar: composes prompt.json into something copyable. -->
<aside id="sidebar" aria-label="Prompt builder" hidden>
  <header>
    <h2>Prompt builder</h2>
    <button id="sidebar-close" type="button" aria-label="Close prompt builder">×</button>
  </header>
  <div id="prompt-addons" role="group" aria-label="Prompt addons"></div>
  <pre id="prompt-preview" aria-live="polite"></pre>
  <footer>
    <button id="prompt-copy" type="button">Copy prompt</button>
  </footer>
</aside>

<!-- Follows the cell under the cursor while the grid is on. -->
<button id="export-cell" type="button" hidden></button>

<!-- Drag-and-drop status: what a drop would hit, then what it did. -->
<div id="import-note" role="status" aria-live="polite" hidden></div>

<!-- Dropping onto a cell that already has a re-render is the one destructive
     thing the viewer can do, so it asks first. -->
<dialog id="replace-dialog">
  <h2>Cell already redrawn</h2>
  <p id="replace-text"></p>
  <form method="dialog">
    <button value="cancel">Cancel</button>
    <button value="replace" id="replace-ok" class="danger">Replace</button>
  </form>
</dialog>

<div id="hud"><span id="zoom-level">100%</span></div>
<div id="spinner" hidden></div>

<noscript>This viewer needs JavaScript.</noscript>

<script src="tiles/info.js"></script>
<script src="app.js"></script>
</body>
</html>
